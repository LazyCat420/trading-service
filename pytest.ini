[pytest]
asyncio_mode = auto
# A per-test wall-clock bound. Added 2026-08-30 after a full `pytest` run sat
# forever at 96%: two tests drove live network calls with no timeout of their
# own — one against an offline LLM endpoint through ResilientCall's five
# retries, one against the scraper service — and a hang is indistinguishable
# from "still running". Both are fixed; this is the backstop, so the next one
# fails with a stack trace naming the test instead of consuming the session.
# 300s is deliberately generous: nothing here should approach it, and a bound
# that trips on a slow box teaches people to remove the bound.
timeout = 300
timeout_method = thread
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    real_mongo: test uses a real MongoDB (isolated test database, never production)
