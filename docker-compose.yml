version: '3.8'

services:
  trading-service:
    image: trading-service:latest
    container_name: trading-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      - DATABASE_URL=postgresql://trader:trading_bot_pass@10.0.0.16:5433/trading_bot
      - API_SERVER_KEY=sun-trading-secure-api-key-2026
      - SCRAPER_SERVICE_URL=http://10.0.0.16:8001
      - USE_LAZY_TOOL_SERVICE=true
      - LAZY_TOOL_SERVICE_URL=http://10.0.0.16:7778
      - PIPELINE_VERSION=v3
      - PYTHONPATH=/app/lazycat-sdk
      - CHART_OUTPUT_DIR=/app/data/charts
    volumes:
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
      - ./logs:/app/logs
      - ../lazycat-sdk:/app/lazycat-sdk:ro
      - ./.agents:/.agents
      - ../notes:/app/notes
      - ./data/charts:/app/data/charts
    ports:
      - "3031:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
