version: '3.8'

services:
  trading-service:
    image: trading-service:latest
    container_name: trading-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      - DATABASE_URL=postgresql://trader:trading_bot_pass@10.0.0.16:5433/trading_bot
      - API_SERVER_KEY=sun-trading-secure-api-key-2026
      - SCRAPER_SERVICE_URL=http://10.0.0.16:8001
      - USE_LAZY_TOOL_SERVICE=true
      - LAZY_TOOL_SERVICE_URL=http://10.0.0.16:7778
      - PIPELINE_VERSION=v3
      - PYTHONPATH=/app/lazycat-sdk
    volumes:
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
      - ./logs:/app/logs
      - ../lazycat-sdk:/app/lazycat-sdk:ro
      - ./.agents:/.agents
    ports:
      - "3031:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
