version: '3.8'

services:
  trading-service:
    image: trading-service:latest
    container_name: trading-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL and API_SERVER_KEY come from .env (synced from
      # vault-service by deploy.sh) — never hardcode secrets here.
      - TZ=America/Los_Angeles
      # Scraping is delegated to the standalone scraper-service again
      # (re-extracted 2026-07-22). The code default is the compose DNS name
      # "scraper-service:8001", which does NOT resolve from this container
      # (separate docker networks) — every sweep failed silently on
      # cycle-v3-1784769797. Pin the host IP.
      - SCRAPER_SERVICE_URL=http://10.0.0.16:8001
      - DISABLE_DDG_SEARCH=true
      - YOUTUBE_COOKIES_FILE=/app/cookies.txt
      - USE_LAZY_TOOL_SERVICE=true
      - LAZY_TOOL_SERVICE_URL=http://10.0.0.16:5591
      # Prism mints the wire prefix from its MCP registration NAME. On
      # 2026-08-07 the server re-registered as `lazy-agent-service` in all
      # three scopes and the `lazy-tool-service` rows were deleted, so prism
      # no longer serves `mcp__lazy-tool-service__*` at all.
      #
      # This matters here because `prism_registration.py` builds each V3
      # persona's `availableTools` with `mcp_tool_name()`. Left on the old
      # default, every persona would be scoped to tool names that no longer
      # exist — which does not raise, it just silently scopes an agent to
      # nothing. Incoming names are unaffected: MCP_PREFIXES accepts all four
      # spellings, and must keep doing so until every consumer has moved.
      #
      # It lives in compose, not .env, because deploy.sh overwrites the remote
      # .env from vault-service on every deploy. Not a secret.
      - MCP_EMIT_PREFIX=mcp__lazy-agent-service__
      # System logs (and the office client's /api/v1/system/stream feed) POST
      # here. Unset, it probes "trading-client:8888" first — a host that does
      # not resolve from this container — and only works via a hardcoded IP
      # fallback. Pin it so the first attempt is the one that works.
      - TRADING_CLIENT_URL=http://10.0.0.16:8888
      - PIPELINE_VERSION=v3
      - PYTHONPATH=/app/lazycat-sdk
      - CHART_OUTPUT_DIR=/app/data/charts
    volumes:
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
      - ./logs:/app/logs
      - ../lazycat-sdk:/app/lazycat-sdk:ro
      - ./.agents:/.agents
      - ../notes:/app/notes
      - ./data/charts:/app/data/charts
      # Absorbed scraper: YouTube cookies for yt-dlp (/stream + youtube collector).
      # deploy.sh touches this remotely so Docker doesn't create a dir if absent.
      - ./cookies.txt:/app/cookies.txt:ro
    ports:
      - "3031:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
